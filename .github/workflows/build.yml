name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Установка всех необходимых системных зависимостей для Buildozer
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev automake build-essential

      # Настройка кэширования для ускорения последующих сборок
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      # Установка python-зависимостей сборщика
      - name: Install Pip Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      # Запуск сборки APK (автоматически принимает лицензии Android SDK)
      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      # Загрузка готового APK в артефакты GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
