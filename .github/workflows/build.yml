name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Get Buildozer Action
        uses: ArtemSaves/buildozer-action@v1
        with:
          buildozer_version: stable
          command: buildozer --verbose android debug
