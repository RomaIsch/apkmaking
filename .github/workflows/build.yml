name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev wget unzip
      - name: Install Buildozer and Build Tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer "cython==0.29.35"
      - name: Setup Android SDK and Install Tools
        run: |
          export ANDROID_HOME=\$PWD/android-sdk
          mkdir -p \$ANDROID_HOME/cmdline-tools
          cd \$ANDROID_HOME/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;30.0.3" "platforms;android-31" "ndk;25b"
      - name: Compile APK with Buildozer
        run: buildozer -v android debug
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
